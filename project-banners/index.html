<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Sappling Chores</title>
  <meta name="description"
    content="A showcase of projects built by the Sappling Chores team — scroll through each project to see demos and source code." />

  <!-- Inter from Google Fonts (single request, display=swap for perf) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation dots (populated by JS) -->
  <nav class="nav-dots" id="navDots" aria-label="Project navigation"></nav>

  <!-- Scroll container — receives scroll-snap -->
  <main class="scroll-container" id="scrollContainer" role="main">
    <!--
      Banners are injected here by main.js.
      To add a project, open projects.js and append a new object to the array.
    -->
  </main>

  <!-- Data & logic (order matters: projects.js must load first) -->
  <script src="projects.js"></script>
  <script src="main.js"></script>
</body>
</html>
